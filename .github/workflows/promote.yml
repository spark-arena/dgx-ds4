name: Promote to stable

# ds4's README describes the project as beta quality and fast changing, and it
# ships no releases, so `:latest` tracks raw upstream HEAD.  `:stable` is the
# tag sparkrun recipes point at and only moves when a human has smoke-tested a
# build on real hardware.

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to promote, e.g. 20260809-84cc882 (without the -cu13x suffix)'
        required: true
        type: string

env:
  IMAGE_REPO: ghcr.io/spark-arena/dgx-ds4

permissions:
  packages: write

concurrency:
  group: ds4-promote
  cancel-in-progress: false

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Retag as stable
        env:
          VERSION: ${{ inputs.version }}
        run: |
          CUDA_VERSION=$(grep '^CUDA_VERSION=' ds4.parameters | head -1 | cut -d= -f2 | xargs)
          CUDA_SHORT=$(echo "$CUDA_VERSION" | cut -d. -f1,2 | tr -d '.')
          SRC="${IMAGE_REPO}:${VERSION}-cu${CUDA_SHORT}"

          # Fails if the multi-arch manifest was never published, which is the
          # point: promoting a version that does not exist must not create an
          # empty `:stable`.
          docker buildx imagetools inspect "$SRC" > /dev/null

          docker buildx imagetools create -t "${IMAGE_REPO}:stable" "$SRC"
          docker buildx imagetools inspect "${IMAGE_REPO}:stable"
          echo "Promoted ${SRC} -> ${IMAGE_REPO}:stable"
